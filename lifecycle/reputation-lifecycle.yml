  sunset_header: false
  deprecation_header: false
  note: >-
    Reputation marks individual endpoints "(Deprecated)" in the documentation but publishes NO
    deprecation policy, no notice period, no removal dates, and no RFC 8594 Sunset/Deprecation
    response headers. A client has no machine-readable signal that an operation is going away.
    No `Deprecation` pointer is wired in apis.yml because there is no policy to point at.

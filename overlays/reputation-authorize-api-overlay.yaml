  update:
    x-pagination:
      style: offset-limit
      default_limit: 20
      params:
      - offset
      - limit
      response_object: pagination
      response_fields:
      - offset
      - limit
      - next
      - previous
      cursor_note: Newer endpoints accept a Base64-encoded cursor token in offset.
    x-idempotency:
      supported: false
      note: Reputation documents no idempotency key or replay contract on write operations.
    x-error-envelope:
      rfc9457: false
      shape: '{ "errors": [ { "error": { "field", "code", "message" } } ] }'
    x-validation-status:
      resource_missing: 404
      validation_failed: 403
      note: Validation failure returns 403, not 400/422.

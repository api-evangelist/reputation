problems:
- status: 400
  title: Bad Parameters
  meanings: [Bad parameters, Account is locked, Invalid parameters, Missing parameters]
  remediation: Correct the request parameters. An account-locked condition also surfaces here and requires operator intervention, not a retry.
  in_spec: true
  operations_declaring: 67
- status: 401
  title: 'Unauthorized: API key is invalid'
  remediation: Verify the X-API-KEY header. Keys are issued by a Reputation customer success manager; there is no self-serve rotation endpoint.
  in_spec: true
  operations_declaring: 67
- status: 403
  title: 'Forbidden: API key is not permitted the operation'
  remediation: >-
    Two distinct causes share this status. Either the key lacks permission for the operation, or the
    request FAILED VALIDATION — the docs state "should the validation not pass, a 403 status code is
    issued". Inspect the errors[] array to tell them apart; a validation 403 is not retryable unmodified.
  in_spec: true
  operations_declaring: 67
- status: 404
  title: 'Resource Not Found'
  meanings: [Resource not found, Missing Tenant Id, Missing Location Id, Missing Source Id]
  remediation: >-
    Also returned when a required identifier is missing rather than merely unknown — a missing
    X-TENANT-ID on an agency key produces a 404, not a 400.
  in_spec: true
  operations_declaring: 67
- status: 405
  title: Action not supported by this method
  remediation: Use the documented HTTP method for the endpoint.
  in_spec: false
  in_docs: true
- status: 429
  title: 'Too many requests. API rate limit exceeded'
  remediation: >-
    Back off and retry. No Retry-After or RateLimit-* header is documented, and no numeric limit is
    published, so a client must implement blind exponential backoff.
  in_spec: true
